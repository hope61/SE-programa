server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    location / {
        try_files $uri $uri/ =404;
    }

    # Static assets: cache aggressively, filenames don't change without a rebuild.
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Schedule data changes more often than the app shell — keep it fresh.
    location /data/ {
        add_header Cache-Control "no-cache";
    }
}
